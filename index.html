<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaxitabidea Pilota Eskola</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero {
            background-color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #1b365d;
            font-size: 36px;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.slogan {
            color: #555;
            font-size: 20px;
            font-style: italic;
            margin-top: 5px;
            margin-bottom: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .nav-card {
            background-color: #1b365d;
            color: #ffffff;
            text-decoration: none;
            padding: 25px 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .nav-card:hover {
            background-color: #2a5288;
            transform: translateY(-4px);
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #1b365d;
            color: #ffffff;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header class="hero">
        <img src="LOGO OFIZIALA.jpg" alt="Abaxitabidea Pilota Eskola Logoa" class="logo">
        <h1>Abaxitabidea Pilota Eskola</h1>
        <p class="slogan">Jolastu eta gozatu pilotaz</p>
    </header>

    <main class="container">
        <nav class="nav-grid">
            <a href="taldeak.html" class="nav-card">
                Taldekatzea eta Horarioak
            </a>
            <a href="araudia.html" class="nav-card">
                Araudia eta Normativa
            </a>
            <a href="egutegia.html" class="nav-card">
                Eskola Egutegia
            </a>
            <a href="partidak.html" class="nav-card">
                Partidak (NKJ / JDN)
            </a>
        </nav>
    </main>

    <footer>
        &copy; Abaxitabidea Pilota Eskola
    </footer>

</body>
</html>
