name: Actualizar Partidos Miercoles (FNPV)

on:
  schedule:
    - cron: '0 8 * * 3' # Todos los miércoles a las 08:00 UTC
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Navegador
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium
          playwright install-deps

      - name: Ejecutar script de automatización
        run: python actualizar_partidos.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add partidak.html
          git commit -m "Auto-actualización de partidos FNPV con Playwright" || exit 0
          git push
