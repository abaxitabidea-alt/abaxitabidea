name: Actualizar Partidos Miercoles (FNPV)

on:
  schedule:
    # Se ejecuta automáticamente todos los miércoles a las 08:00 UTC
    - cron: '0 8 * * 3'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar script de actualización
        run: python actualizar_partidos.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add partidak.html
          git commit -m "Auto-actualización de partidos FNPV" || exit 0
          git push
